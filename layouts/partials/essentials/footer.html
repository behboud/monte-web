{{ $footerImage := resources.Get "images/zaun.png" }}
{{ $currentPage := . }}


<footer class="bg-body pl-3 pr-3 pb-8">
  <div class="container">
    <div class="items-center pt-8">
      <div class="relative mb-0">
        <a class="block" href="{{ site.Home.RelPermalink }}">
          <img class="img w-full" src="{{ $footerImage.RelPermalink }}" alt="Bunter Zaun der Montessori Schule Gilching" width="{{ $footerImage.Width }}" height="{{ $footerImage.Height }}" />
        </a>
        <div class="footer-links px-0 text-center text-monte md:px-2 xl:px-4 xl:text-sm">
          {{ $menuItems := partial "components/menu-items.html" (dict "MenuID" "footer" "Page" $currentPage) }}
          <ul class="flex flex-wrap items-center justify-center gap-x-1.5 md:gap-x-0">
            {{ range $menuItems }}
              <li class="mx-0 {{ if .icon }}inline-flex items-center leading-none md:text-base xl:text-xl{{ else }}inline-block{{ end }} md:mx-2 xl:mx-3">
                <a
                  {{ if .icon }}aria-label="{{ .name }}"{{ end }}
                  {{ if .open_in_new_tab }}
                    target="_blank" rel="{{ if .nofollow }}nofollow noopener{{ else }}noopener{{ end }}"
                  {{ else if .external }}
                    target="_self" rel="noopener"
                  {{ end }}
                  href="{{ .href }}">
                  {{ if .icon }}
                    <i class="{{ .icon }}"></i>
                  {{ else }}
                    {{ .name }}
                  {{ end }}
                </a>
              </li>
            {{ end }}
          </ul>
        </div>
      </div>
    </div>
  </div>
</footer>

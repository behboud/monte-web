<nav id="mymenu" class="hidden">
  <ul class="NoListView">
    {{ range (partial "components/menu-items.html" (dict "MenuID" .menuID "Page" .page)) }}
      {{ $isCurrent := eq .href $.page.RelPermalink }}
      <li{{ if $isCurrent }} class="active"{{ end }}>
        <a href="{{ .href }}"{{ if $isCurrent }} class="active" aria-current="page"{{ end }}>{{ .name }}</a>
      </li>
    {{ end }}
  </ul>
</nav>

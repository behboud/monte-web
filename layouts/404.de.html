{{ define "main" }}
  {{ partial "components/page-title" (dict "Context" . "Title" "Seite nicht gefunden") }}
  <section class="container px-3 mb-12 text-center">
    <div class="reading-prose">
      <p>Die Seite, die Sie suchen, wurde möglicherweise entfernt, hat einen anderen Namen oder ist vorübergehend nicht verfügbar.</p>
      <p><a href="{{ site.BaseURL | relLangURL }}" class="btn btn-default mt-6">Zurück zur Startseite</a></p>
    </div>
  </section>
{{ end }}

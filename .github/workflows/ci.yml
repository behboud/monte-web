name: Astro and EmDash CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate the generated content model
        run: npm run test:content-model

      - name: Build the Node server
        env:
          DATABASE_URL: file:${{ runner.temp }}/emdash-ci.db
          EMDASH_UPLOADS_DIR: ${{ runner.temp }}/emdash-ci-uploads
        run: npm run build

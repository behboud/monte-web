# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: behboud/monte-web
  branch: main # Branch to update (optional; defaults to master)
  base_url: https://sveltia-cms-auth.b-kalantary.workers.dev
  commit_messages:
    create: Create {{collection}} {{slug}} {{author-name}}
    update: Update {{collection}} {{slug}} {{author-name}}
    delete: Delete {{collection}} {{slug}} {{author-name}}
    uploadMedia: Upload {{path}} {{author-name}}
    deleteMedia: Delete {{path}} {{author-name}}
    openAuthoring: "{{message}} {{author-name}}"
site_url: "https://behboud.github.io/monte-web/"
media_folder: /assets/images
public_folder: /images
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 82
        width: 2048
        height: 2048
      svg:
        optimize: true
display_url: "https://behboud.github.io/monte-web/"
logo_url: /monte-web/images/logo-montessorischulegilching.gif
locale: "de"
app_title: "Montessorri Schule Gilching CMS"
collections:
  - name: "site_settings"
    label: "Site Settings"
    files:
      - file: "hugo.toml"
        label: Site Config
        name: config
        editor:
          preview: false
        fields:
          - { label: Site Title for Browser Tab, name: title, widget: string }
  - name: "aktuelles"
    label: "Aktuelles"
    folder: "content/de/aktuelles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Stimmungsbild", name: "image", widget: "image", comment: "Bitte vor der Veröffentlichung die Bildrechte und die Einwilligung der erkennbaren Personen prüfen." }
      - name: "tags"
        widget: "select"
        label: "Tags"
        multiple: true
        create: true
        options: ["Mitglieder", "Termin", "Projekt", "Verein"]
      - { label: "Inhalt", name: "body", widget: "markdown" }
      - { label: "Datum", name: "date", widget: "hidden", default: "{{now}}" }
  - name: "start"
    label: "Startseite"
    editor:
      preview: false
    files:
      - label: "Startseite"
        name: "index"
        file: "content/de/_index.md"
        fields:
          - label: "Banner"
            name: "banner"
            widget: "object"
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Untertitel", name: "content", widget: "string", required: false }
          - label: "Slider Gallery"
            name: "slider"
            widget: object
            fields:
              - label: "Bilder"
                name: "images"
                widget: image
                multiple: true
                allow_add: true
                default: []
                comment: "Bitte vor der Veröffentlichung die Bildrechte und die Einwilligung der erkennbaren Personen prüfen. Bei mehreren Bildern die Prüfung je Bild dokumentieren."
          - { label: "Inhalt", name: "body", widget: "markdown", required: false }
  - name: "pages"
    label: "Einzelseiten"
    editor:
      preview: false
    files:
      - file: "content/de/pages/impressum.md"
        label: "Impressum"
        name: "impressum"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Entwurf", name: "draft", widget: "boolean", required: false, default: false }
          - label: "Bereichslinks"
            name: "section_cards"
            widget: "object"
            required: false
            fields:
              - { label: "Anzeigen", name: "enable", widget: "boolean", required: false, default: false }
              - label: "Elemente"
                name: "items"
                widget: "list"
                min: 1
                max: 5
                required: false
                fields:
                  - { label: "Titel", name: "title", widget: "string" }
                  - { label: "Kurzbeschreibung", name: "description", widget: "text" }
                  - { label: "Bild", name: "image", widget: "image" }
                  - { label: "Zielabschnitt (z. B. #schulalltag)", name: "href", widget: "string" }
          - label: "Seitenübersicht (ein TOC)"
            name: "toc"
            widget: "object"
            required: false
            fields:
              - { label: "Anzeigen", name: "enable", widget: "boolean", required: false, default: false }
              - { label: "Titel", name: "title", widget: "string", required: false, default: "Seitenübersicht" }
              - label: "Bereiche"
                name: "sections"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Überschrift", name: "title", widget: "string", required: false }
          - { label: "Inhalt", name: "body", widget: "markdown" }
      - file: "content/de/pages/datenschutz.md"
        label: "Datenschutz"
        name: "datenschutz"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Entwurf", name: "draft", widget: "boolean", required: false, default: false }
          - label: "Bereichslinks"
            name: "section_cards"
            widget: "object"
            required: false
            fields:
              - { label: "Anzeigen", name: "enable", widget: "boolean", required: false, default: false }
              - label: "Elemente"
                name: "items"
                widget: "list"
                min: 1
                max: 5
                required: false
                fields:
                  - { label: "Titel", name: "title", widget: "string" }
                  - { label: "Kurzbeschreibung", name: "description", widget: "text" }
                  - { label: "Bild", name: "image", widget: "image" }
                  - { label: "Zielabschnitt (z. B. #schulalltag)", name: "href", widget: "string" }
          - label: "Seitenübersicht (ein TOC)"
            name: "toc"
            widget: "object"
            required: false
            fields:
              - { label: "Anzeigen", name: "enable", widget: "boolean", required: false, default: false }
              - { label: "Titel", name: "title", widget: "string", required: false, default: "Seitenübersicht" }
              - label: "Bereiche"
                name: "sections"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Überschrift", name: "title", widget: "string", required: false }
          - { label: "Inhalt", name: "body", widget: "markdown" }
      - file: "content/de/pages/karriere.md"
        label: "Karriere"
        name: "karriere"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Entwurf", name: "draft", widget: "boolean", required: false, default: false }
          - { label: "Inhalt", name: "body", widget: "markdown" }
      - file: "content/de/pages/presse.md"
        label: "Presse"
        name: "presse"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Entwurf", name: "draft", widget: "boolean", required: false, default: false }
          - label: "Bereichslinks"
            name: "section_cards"
            widget: "object"
            required: false
            fields:
              - { label: "Anzeigen", name: "enable", widget: "boolean", required: false, default: false }
              - label: "Elemente"
                name: "items"
                widget: "list"
                min: 1
                max: 5
                required: false
                fields:
                  - { label: "Titel", name: "title", widget: "string" }
                  - { label: "Kurzbeschreibung", name: "description", widget: "text" }
                  - { label: "Bild", name: "image", widget: "image" }
                  - { label: "Zielabschnitt (z. B. #schulalltag)", name: "href", widget: "string" }
          - label: "Seitenübersicht (ein TOC)"
            name: "toc"
            widget: "object"
            required: false
            fields:
              - { label: "Anzeigen", name: "enable", widget: "boolean", required: false, default: false }
              - { label: "Titel", name: "title", widget: "string", required: false, default: "Seitenübersicht" }
              - label: "Bereiche"
                name: "sections"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Überschrift", name: "title", widget: "string", required: false }
          - { label: "Inhalt", name: "body", widget: "markdown" }
  - name: "speiseplan"
    label: "Speiseplan"
    editor:
      preview: false
    files:
      - file: "content/de/speiseplan/_index.md"
        label: "Speiseplan"
        name: "speiseplan"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Entwurf", name: "draft", widget: "boolean", required: false, default: false }
          - label: "Slider"
            name: "slider"
            widget: "object"
            required: false
            fields:
              - { label: "Aktivieren", name: "enable", widget: "boolean", required: false, default: false }
              - label: "Bilder"
                name: "images"
                widget: "list"
                required: false
                field: { label: "Bild", name: "image", widget: "image", comment: "Bitte vor der Veröffentlichung die Bildrechte und die Einwilligung der erkennbaren Personen prüfen." }
          - label: "Wochenplan"
            name: "meal_plan"
            widget: "object"
            fields:
              - label: "Tage"
                name: "days"
                widget: "list"
                min: 1
                fields:
                  - label: "Datum"
                    name: "date"
                    widget: "datetime"
                    time_format: false
                    required: false
                  - { label: "Hauptgericht", name: "main", widget: "string" }
                  - { label: "Beilage", name: "side", widget: "string", required: false }
                  - { label: "Nachtisch", name: "dessert", widget: "string", required: false }
                  - { label: "Getränk", name: "drink", widget: "string", required: false }
              - label: "Hinweise"
                name: "notes"
                widget: "list"
                required: false
                field: { label: "Hinweis", name: "note", widget: "string" }
          - { label: "Mittagsverpflegung (Text)", name: "body", widget: "markdown" }
  - name: "kontakt_settings"
    label: "Kontakt & Social"
    editor:
      preview: false
    files:
      - file: "content/de/pages/kontakt.md"
        label: "Kontakt"
        name: "kontakt"
        fields:

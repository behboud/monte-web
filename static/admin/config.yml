          - { label: "Entwurf", name: "draft", widget: "boolean", required: false, default: false }
          - label: "Slider"
            name: "slider"
            widget: "object"
            required: false
            fields:
              - { label: "Aktivieren", name: "enable", widget: "boolean", required: false, default: false }
              - label: "Bilder"
                name: "images"
                widget: "list"
                required: false
                field: { label: "Bild", name: "image", widget: "image", comment: "Bitte vor der Veröffentlichung die Bildrechte und die Einwilligung der erkennbaren Personen prüfen." }
          - { label: "Überschrift", name: "uberschrift", widget: "string", required: false }
          - label: "Förderprojekte"
            name: "projekte"
            widget: "list"
            required: false
            fields:
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Bild", name: "image", widget: "image", comment: "Bitte vor der Veröffentlichung Bildrechte und Veröffentlichungserlaubnis prüfen." }
              - { label: "Im Förder-Popup hervorheben", name: "highlight", widget: "boolean", required: false, default: false }
              - { label: "Text", name: "content", widget: "markdown" }
              - { label: "Förderlink", name: "url", widget: "string" }
              - label: "Prüfung der Veröffentlichung"
                name: "publication_review"
                widget: "object"
                required: false
                comment: "Interne Prüfinformation für Projekt, Organisation, Logo und Link. Dieser Status blendet den Eintrag nicht aus und ersetzt keine rechtliche Freigabe."
                fields:
                  - label: "Status"
                    name: "status"
                    widget: "select"
                    required: false
                    default: "not_reviewed"
                    options:
                      - { label: "Nicht geprüft", value: "not_reviewed" }
                      - { label: "Geprüft", value: "reviewed" }
                      - { label: "Rückfrage nötig", value: "needs_review" }
                  - { label: "Nachweis/Referenz", name: "reference", widget: "string", required: false }
                  - { label: "Prüfdatum", name: "reviewed_at", widget: "datetime", type: "date", required: false }
                  - { label: "Wiedervorlage", name: "review_until", widget: "datetime", type: "date", required: false }
      - file: "content/de/verein/_index.md"
        label: "Verein"
        name: "verein"
        fields:
          - { label: "Titel", name: "title", widget: "string" }
          - { label: "Entwurf", name: "draft", widget: "boolean", required: false, default: false }
          - label: "Slider"
            name: "slider"
            widget: "object"
            required: false
            fields:
              - { label: "Aktivieren", name: "enable", widget: "boolean", required: false, default: false }
              - label: "Bilder"
                name: "images"
                widget: "list"
                required: false
                field: { label: "Bild", name: "image", widget: "image", comment: "Bitte vor der Veröffentlichung die Bildrechte und die Einwilligung der erkennbaren Personen prüfen." }
          - label: "Bereichslinks"
            name: "section_cards"
            widget: "object"
            required: false
            fields:
              - { label: "Anzeigen", name: "enable", widget: "boolean", required: false, default: false }
              - label: "Elemente"
                name: "items"
                widget: "list"
                min: 1
                max: 5
                required: false
                fields:
                  - { label: "Titel", name: "title", widget: "string" }
                  - { label: "Kurzbeschreibung", name: "description", widget: "text" }
                  - { label: "Bild", name: "image", widget: "image" }
                  - { label: "Zielabschnitt (z. B. #schulalltag)", name: "href", widget: "string" }
          - label: "Seitenübersicht (ein TOC)"
            name: "toc"
            widget: "object"
            required: false
            fields:
              - { label: "Anzeigen", name: "enable", widget: "boolean", required: false, default: false }
              - { label: "Titel", name: "title", widget: "string", required: false, default: "Seitenübersicht" }
              - label: "Bereiche"
                name: "sections"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Überschrift", name: "title", widget: "string", required: false }
                  - { label: "Bild", name: "image", widget: "image", required: false }
                  - { label: "Inhalt", name: "content", widget: "markdown", required: false }

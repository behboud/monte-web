######################## default configuration ####################
baseURL = "/"
title = "Montessori Schule Gilching (München West)"
timeZone = "Europe/Berlin"
summaryLength = 10
defaultContentLanguage = "de"

########################## Permalinks ############################
[permalinks.page]
  pages = "/:slugorcontentbasename/"

[permalinks.section]
  elternengagement = "/elternengagement/"

############################# Build ##############################
[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = "assets/notwatching/hugo_stats\\.json"
    target = "css"
  [[build.cachebusters]]
    source = "(postcss|tailwind)\\.config\\.js"
    target = "css"

############################# Module #############################
[module]
  [module.hugoVersion]
    extended = true
    min = "0.166.0"

  [[module.mounts]]
    source = "assets"
    target = "assets"

  [[module.mounts]]
    disableWatch = true
    source = "hugo_stats.json"
    target = "assets/notwatching/hugo_stats.json"

  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/images"

  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/components/social-share"

  [[module.imports]]
    path = "github.com/gethugothemes/hugo-modules/seo-tools/basic-seo"

############################# Related #############################
[related]
  threshold = 80
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

############################# Imaging ############################
[imaging]
  resampleFilter = "Lanczos"
  [imaging.jpeg]
    quality = 80
  [imaging.webp]
    quality = 80

########################### Security ##############################
[security.node.permissions]
  allowAddons = ["postcss"]
  allowRead = ["."]

############################ Caches ##############################
[caches]
  [caches.images]
    dir = ":resourceDir/_gen"
    maxAge = "720h"
  [caches.assets]
    dir = ":resourceDir/_gen"
    maxAge = "720h"

########################### Languages ##############################
[languages]
  [languages.de]
    locale = "de-DE"
    contentDir = "content/de"

############################# Menus ################################
# Pages declare their menus in front matter; additional links are stored with the contact page.

############################# Params ###############################
[params]
  favicon = "images/favicon-96x96.png"

  [params.metadata]
    keywords = ["Montessori", "Grundschule", "Schule", "Gilching", "München", "Westen"]
    description = "Montessori Schule Gilching (München Westen)"
    author = "Monrtessori Schule Gilching"

############################# Plugins ##############################
  [[params.plugins.css]]
    link = "plugins/swiper/swiper-bundle.css"
    lazy = true

  [[params.plugins.css]]
    link = "plugins/font-awesome/v6/brands.css"
    lazy = true

  [[params.plugins.css]]
    link = "plugins/font-awesome/v6/solid.css"
    lazy = true

  [[params.plugins.css]]
    link = "plugins/font-awesome/v6/icons.css"
    lazy = true

  [[params.plugins.css]]
    link = "plugins/mmenu/mmenu.css"
    lazy = false

  [[params.plugins.js]]
    link = "plugins/swiper/swiper-bundle.js"
    lazy = false
